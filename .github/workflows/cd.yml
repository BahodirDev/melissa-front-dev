name: Melissa Front Deploy (Dev)

on:
  push:
    branches:
      - development  # faqat development branch uchun

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        run: |
          echo "🏗️ Building optimized production build..."
          CI=false NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FRONT_SSH_KEY }}

      - name: Deploy build folder to server
        run: |
          echo "🚀 Uploading build folder to dev server..."
          rsync -avz --delete \
            ./build/ \
            ${{ secrets.FRONT_SSH_USER }}@${{ secrets.FRONT_SSH_HOST }}:/var/www/html/

          echo "✅ Frontend deployed successfully!"
